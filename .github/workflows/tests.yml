name: Tests

on:
  push:
    branches: [main]
    paths: [BallisticSolutions/**]
  pull_request:
    paths: [BallisticSolutions/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        working-directory: BallisticSolutions
        run: dotnet build --configuration Release

      - name: Test
        working-directory: BallisticSolutions
        run: dotnet test --no-build --configuration Release
