name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  ASSET_BASENAME: ballistic-solutions

permissions: {}

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Check tag format
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::'$TAG' is not a X.Y.Z tag"; exit 1; }

  release:
    name: Stage release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Check tag matches every version string
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          fail=0

          check() { # file  extracted-version
            if [ "$2" != "$TAG" ]; then
              echo "::error file=$1::$1 has version '$2', expected '$TAG'"
              fail=1
            fi
          }

          csproj=BallisticSolutions/src/BallisticSolutions/BallisticSolutions.csproj
          check "$csproj" "$(grep -oPm1 '(?<=<Version>)[^<]+' "$csproj")"

          for addon in BallisticSolutions.Godot ballistic_solutions; do
            cfg="ballistic_solutions_godot/addons/$addon/plugin.cfg"
            check "$cfg" "$(grep -oPm1 '(?<=^version=")[^"]+' "$cfg")"
          done

          exit $fail

      - name: Package Godot addons
        working-directory: ballistic_solutions_godot
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          zip -r "$GITHUB_WORKSPACE/$ASSET_BASENAME-$TAG.zip" addons

      - name: Attest release asset provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.ASSET_BASENAME }}-${{ inputs.tag || github.ref_name }}.zip

      - name: Stage draft release with addons
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes --draft
          gh release upload "$TAG" "$ASSET_BASENAME-$TAG.zip" --clobber
