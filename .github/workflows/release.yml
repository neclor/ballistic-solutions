name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (created from the selected branch if missing)
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  ASSET_BASENAME: ballistic-solutions

permissions: {}

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check tag format
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::'$TAG' is not a X.Y.Z tag"; exit 1; }

      - name: Create tag if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1 \
            || gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null

  release:
    name: Stage release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Check tag matches every version string
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          fail=0

          check() { # file  extracted-version
            if [ "$2" != "$TAG" ]; then
              echo "::error file=$1::$1 has version '$2', expected '$TAG'"
              fail=1
            fi
          }

          csproj=BallisticSolutions/src/BallisticSolutions/BallisticSolutions.csproj
          check "$csproj" "$(grep -oPm1 '(?<=<Version>)[^<]+' "$csproj")"

          for addon in BallisticSolutions.Godot ballistic_solutions; do
            cfg="ballistic_solutions_godot/addons/$addon/plugin.cfg"
            check "$cfg" "$(grep -oPm1 '(?<=^version=")[^"]+' "$cfg")"
          done

          exit $fail

      - name: Package Godot addons
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        working-directory: ballistic_solutions_godot
        run: |
          set -euo pipefail
          zip -r "$GITHUB_WORKSPACE/$ASSET_BASENAME-$TAG.zip" addons

      - name: Attest release asset provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ASSET_BASENAME }}-${{ inputs.tag || github.ref_name }}.zip

      - name: Stage draft release with addons
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes --draft --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" "$ASSET_BASENAME-$TAG.zip" --clobber --repo "$GITHUB_REPOSITORY"
