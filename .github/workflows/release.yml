name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release
        required: true

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push)              tag="$GITHUB_REF_NAME" ;;
            release)           tag="$RELEASE_TAG" ;;
            workflow_dispatch) tag="$INPUT_TAG" ;;
            *) echo "::error::unexpected event '$GITHUB_EVENT_NAME'"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Check tag matches every version string
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          fail=0

          check() { # file  extracted-version
            if [ "$2" != "$TAG" ]; then
              echo "::error file=$1::$1 has version '$2', expected '$TAG'"
              fail=1
            fi
          }

          csproj=BallisticSolutions/src/BallisticSolutions/BallisticSolutions.csproj
          check "$csproj" "$(grep -oPm1 '(?<=<Version>)[^<]+' "$csproj")"

          # Addons shipped by this release; real_equation_solver is versioned separately.
          for addon in BallisticSolutions.Godot ballistic_solutions; do
            cfg="ballistic_solutions_godot/addons/$addon/plugin.cfg"
            check "$cfg" "$(grep -oPm1 '(?<=^version=")[^"]+' "$cfg")"
          done

          exit $fail

      - name: Package Godot addons
        working-directory: ballistic_solutions_godot
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          zip -r "$GITHUB_WORKSPACE/addons-$TAG.zip" addons

      - name: Publish release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Tag push / manual run: stage a draft as the approval gate.
          # `release: published` only fires once the draft is published, and the
          # release already exists by then, so create is skipped.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes --draft
          gh release upload "$TAG" "addons-$TAG.zip" --clobber
