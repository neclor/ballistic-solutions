name: Publish NuGet

on:
  release:
    types: [published]

concurrency:
  group: publish-nuget
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish-nuget:
    name: Pack & Publish NuGet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        working-directory: BallisticSolutions
        run: dotnet test --configuration Release

      - name: Pack
        working-directory: BallisticSolutions
        run: dotnet pack --no-restore --configuration Release --output artifacts

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        working-directory: BallisticSolutions
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
